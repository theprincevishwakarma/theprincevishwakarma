  <text x="600" y="200" font-size="22" fill="#7dd3fc">Aspiring Software Engineer | Full-Stack Developer</text>
  <text x="600" y="236" font-size="16" fill="#c7d2fe" opacity="0.85">Dream. Code. Build. Repeat.</text>
